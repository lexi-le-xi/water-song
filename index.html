<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Water Song</title>
<style>
  html, body { margin: 0; height: 100%; background: #061a04; overflow: hidden;
    font-family: -apple-system, "Helvetica Neue", sans-serif; color: #eef9df; }
  #gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: crosshair; }
  #fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  #cam { position: fixed; right: 16px; bottom: 16px; width: 220px; border-radius: 10px; opacity: .85;
    border: 1px solid rgba(255,255,255,.25); box-shadow: 0 6px 24px rgba(0,0,0,.35); display: none; }
  #status { position: fixed; left: 16px; top: 14px; font-size: 12px; letter-spacing: .04em;
    opacity: .75; text-shadow: 0 1px 3px rgba(0,0,0,.6); pointer-events: none; }
  #hint { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); font-size: 13px;
    opacity: .8; text-shadow: 0 1px 3px rgba(0,0,0,.6); transition: opacity 2s; pointer-events: none; width: max-content; max-width: calc(100vw - 32px); text-align: center; }
  #start { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; background: rgba(4, 22, 3, .45); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    cursor: pointer; transition: opacity 1.2s; user-select: none; }
  #start h1 { margin: 0; font-weight: 300; font-size: 40px; letter-spacing: .35em; text-align: center; }
  #start p { margin: 0; opacity: .8; font-size: 14px; letter-spacing: .08em; font-style: italic; }
  #start .btn { margin-top: 18px; padding: 10px 28px; border: 1px solid rgba(255,255,255,.5); border-radius: 999px; font-size: 14px; letter-spacing: .2em;
    max-width: calc(100vw - 32px); box-sizing: border-box; text-align: center; }
  #start p { padding: 0 16px; text-align: center; }
  @media (max-width: 520px) { #start h1 { font-size: 30px; letter-spacing: .25em; } #start .btn { font-size: 12px; letter-spacing: .12em; padding: 10px 20px; } }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="fx"></canvas>
<canvas id="cam"></canvas>
<video id="video" playsinline muted style="display:none"></video>
<div id="status"></div>
<div id="hint">Tap your fingers in front of the camera like playing piano · or click the water · 1–0 test notes · C camera preview · M mute · F fullscreen</div>
<div id="start">
  <h1>WATER SONG</h1>
  <p>Tap your fingers, and the water answers</p>
  <div class="btn">CLICK TO BEGIN · ALLOW CAMERA</div>
</div>

<script type="module">
// ============================================================
//  WebGL setup
// ============================================================
const canvas = document.getElementById('gl');
const gl = canvas.getContext('webgl2', { antialias: false, alpha: false });
const statusEl = document.getElementById('status');
const setStatus = s => statusEl.textContent = s;
if (!gl) { setStatus('This browser does not support WebGL2'); throw new Error('no webgl2'); }

const hasCBF = gl.getExtension('EXT_color_buffer_float');
const hasF32Linear = gl.getExtension('OES_texture_float_linear');
const IFMT = hasCBF && hasF32Linear ? gl.RGBA32F : gl.RGBA16F;
const TYPE = hasCBF && hasF32Linear ? gl.FLOAT : gl.HALF_FLOAT;

const VS = `#version 300 es
layout(location=0) in vec2 aPos;
out vec2 vUv;
void main(){ vUv = aPos*0.5+0.5; gl_Position = vec4(aPos,0.0,1.0); }`;

const HEAD = `#version 300 es
precision highp float;
in vec2 vUv; out vec4 outColor;
uniform sampler2D uTex; uniform vec2 uTexel;
`;

// Adds up to 16 cosine-shaped drops in a single pass.
const DROP_FS = HEAD + `
uniform vec4 uDrops[16]; uniform int uCount; uniform float uAspect;
void main(){
  vec4 info = texture(uTex, vUv);
  for (int i = 0; i < 16; i++) {
    if (i >= uCount) break;
    vec4 d = uDrops[i];
    vec2 off = (vUv - d.xy) * vec2(uAspect, 1.0);
    float k = max(0.0, 1.0 - length(off) / d.z);
    k = 0.5 - cos(k * 3.14159265) * 0.5;
    info.r += k * d.w;
  }
  outColor = info;
}`;

// Height-field wave equation (r = height, g = velocity).
const UPDATE_FS = HEAD + `
uniform float uDamp;
void main(){
  vec4 info = texture(uTex, vUv);
  float avg = ( texture(uTex, vUv - vec2(uTexel.x,0)).r + texture(uTex, vUv + vec2(uTexel.x,0)).r
              + texture(uTex, vUv - vec2(0,uTexel.y)).r + texture(uTex, vUv + vec2(0,uTexel.y)).r ) * 0.25;
  info.g += (avg - info.r) * 2.0;
  float edge = min(min(vUv.x, 1.0 - vUv.x), min(vUv.y, 1.0 - vUv.y));
  info.g *= uDamp * mix(0.9, 1.0, smoothstep(0.0, 0.05, edge)); // absorb at the borders: the lake goes on
  info.r += info.g;
  info.r *= 0.9997;
  outColor = info;
}`;

// Stores the height gradient in b/a.
const GRAD_FS = HEAD + `
void main(){
  vec4 info = texture(uTex, vUv);
  info.b = texture(uTex, vUv + vec2(uTexel.x,0)).r - texture(uTex, vUv - vec2(uTexel.x,0)).r;
  info.a = texture(uTex, vUv + vec2(0,uTexel.y)).r - texture(uTex, vUv - vec2(0,uTexel.y)).r;
  outColor = info;
}`;

// Final image: a sunlit canopy reflected in gently moving water, distorted by both
// the procedural wind ripples and the simulated drop ripples.
const RENDER_FS = HEAD + `
uniform float uTime, uAspect, uSimScale, uAmb;

vec2 hash2(vec2 p){
  p = vec2(dot(p, vec2(127.1,311.7)), dot(p, vec2(269.5,183.3)));
  return -1.0 + 2.0 * fract(sin(p) * 43758.5453123);
}
float gnoise(vec2 p){
  vec2 i = floor(p), f = fract(p);
  vec2 u = f*f*(3.0-2.0*f);
  return mix(mix(dot(hash2(i), f), dot(hash2(i+vec2(1,0)), f-vec2(1,0)), u.x),
             mix(dot(hash2(i+vec2(0,1)), f-vec2(0,1)), dot(hash2(i+vec2(1,1)), f-vec2(1,1)), u.x), u.y);
}
const mat2 ROT = mat2(1.6, 1.2, -1.2, 1.6);
float fbm(vec2 p){
  float a = 0.5, s = 0.0;
  for (int i = 0; i < 5; i++) { s += a * gnoise(p); p = ROT * p; a *= 0.5; }
  return s;
}

// Wind-driven surface: several noise layers drifting in different directions,
// so the pattern evolves instead of just sliding.
float waterH(vec2 p, float t){
  vec2 w = vec2(gnoise(p*0.7 + t*0.04), gnoise(p*0.7 - t*0.035 + 5.2));
  p += w * 0.7;
  float h = gnoise(p*1.6 + vec2(t*0.22, t*0.08)) * 0.60
          + gnoise(ROT*p*1.1 - vec2(t*0.15, -t*0.19)) * 0.60
          + gnoise(p*3.4 + vec2(-t*0.30, t*0.26)) * 0.18
          - sqrt(pow(gnoise(ROT*p*2.6 + vec2(t*0.2, t*0.3)), 2.0) + 0.004) * 0.12   // soft creases → glassy facets
          + gnoise(ROT*p*6.5 + vec2(t*0.45, -t*0.4)) * 0.04;
  return h;
}

// What the water reflects: leaves backlit by the sun, with sky showing through gaps.
vec3 canopy(vec2 p, vec2 uv){
  float t = uTime * 0.006;
  vec2 q = p + vec2(fbm(p*0.8 + vec2(1.7,9.2) + t), fbm(p*0.8 + vec2(8.3,2.8) - t)) * 0.9;
  float n = fbm(q*1.5) * 0.5 + 0.5;
  float d = fbm(q*2.8 + 3.1) * 0.5 + 0.5;
  float v = n*0.9 + d*0.25 - 0.08;
  v += (uv.x*0.18 - uv.y*0.10);                    // brighter toward lower right, like the photo
  vec3 dark   = vec3(0.012, 0.085, 0.010);
  vec3 deep   = vec3(0.045, 0.250, 0.020);
  vec3 mid    = vec3(0.180, 0.520, 0.035);
  vec3 bright = vec3(0.470, 0.800, 0.090);
  vec3 lime   = vec3(0.780, 0.960, 0.340);
  vec3 col = mix(dark, deep, smoothstep(0.18, 0.36, v));
  col = mix(col, mid,    smoothstep(0.34, 0.50, v));
  col = mix(col, bright, smoothstep(0.50, 0.64, v));
  col = mix(col, lime,   smoothstep(0.66, 0.80, v));
  float sky = smoothstep(0.60, 0.68, fbm(q*1.15 + 11.0)*0.5 + 0.5 + uv.x*0.05);
  col = mix(col, vec3(0.80, 0.92, 1.0), sky * 0.85);
  return col;
}

void main(){
  vec2 uv = vUv;
  vec2 p = vec2(uv.x * uAspect, uv.y) * 2.2;
  float t = uTime;
  float e = 0.004;
  float h0 = waterH(p, t);
  vec2 ag = vec2(waterH(p + vec2(e,0), t) - h0, waterH(p + vec2(0,e), t) - h0) / e;

  vec4 sim = texture(uTex, uv);
  vec2 sg = sim.ba * uSimScale;
  vec2 g = ag * uAmb + sg;
  vec3 n = normalize(vec3(-g, 1.0));

  vec2 sp = p * 0.85 + n.xy * 0.55;
  vec3 col = canopy(sp, uv);

  vec3 L = normalize(vec3(0.35, 0.55, 0.75));
  float shade = max(dot(n, L), 0.0) / L.z;
  col *= pow(shade, 1.7);

  vec3 R = reflect(-L, n);
  float spec = pow(max(R.z, 0.0), 90.0);
  float sheen = pow(max(R.z, 0.0), 10.0);
  col += vec3(0.92, 1.0, 0.95) * spec * 1.1 + vec3(0.55, 0.85, 0.25) * sheen * 0.12;

  float ring = smoothstep(0.03, 0.35, length(sg));
  col += vec3(0.55, 0.75, 0.55) * ring * 0.12;

  col *= 0.82 + 0.18 * smoothstep(1.15, 0.25, length((uv - 0.5) * vec2(1.2, 1.0)) * 1.3);
  // grade: punchier, more saturated greens like the photo
  float lum = dot(col, vec3(0.299, 0.587, 0.114));
  col = mix(vec3(lum), col, 1.3);
  col = clamp(col, 0.0, 1.0);
  col = mix(col, col*col*(3.0 - 2.0*col), 0.45) * 1.08;
  outColor = vec4(col, 1.0);
}`;

function compile(type, src){
  const s = gl.createShader(type);
  gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
function program(fs){
  const p = gl.createProgram();
  gl.attachShader(p, compile(gl.VERTEX_SHADER, VS));
  gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  const cache = {};
  p.u = name => name in cache ? cache[name] : (cache[name] = gl.getUniformLocation(p, name));
  return p;
}
const dropProg = program(DROP_FS), updateProg = program(UPDATE_FS),
      gradProg = program(GRAD_FS), renderProg = program(RENDER_FS);

const vao = gl.createVertexArray();
gl.bindVertexArray(vao);
gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0);
gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

// ============================================================
//  Ripple simulation (ping-pong float textures)
// ============================================================
const SIM_H = 512;
let simW = 0, simA, simB, aspect = 1;

function makeTarget(w, h){
  const t = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texImage2D(gl.TEXTURE_2D, 0, IFMT, w, h, 0, gl.RGBA, TYPE, null);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  const fb = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, t, 0);
  gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT);
  return { t, fb };
}

function simPass(prog, setUniforms){
  gl.bindFramebuffer(gl.FRAMEBUFFER, simB.fb);
  gl.viewport(0, 0, simW, SIM_H);
  gl.useProgram(prog);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, simA.t);
  gl.uniform1i(prog.u('uTex'), 0);
  gl.uniform2f(prog.u('uTexel'), 1 / simW, 1 / SIM_H);
  setUniforms && setUniforms();
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  [simA, simB] = [simB, simA];
}

const fxCanvas = document.getElementById('fx');
const fx = fxCanvas.getContext('2d');

function resize(){
  const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
  canvas.width = Math.round(innerWidth * dpr);
  canvas.height = Math.round(innerHeight * dpr);
  fxCanvas.width = innerWidth; fxCanvas.height = innerHeight;
  aspect = innerWidth / innerHeight;
  const w = Math.round(SIM_H * aspect);
  if (w !== simW) {
    simW = w;
    simA = makeTarget(simW, SIM_H);
    simB = makeTarget(simW, SIM_H);
  }
}
addEventListener('resize', resize);
resize();

// Pending drops: {x, y (0..1, y down), r, s, at (ms)}
const drops = [];
function addDrop(x, y, r, s, delay = 0){
  drops.push({ x, y, r, s, at: performance.now() + delay });
}

// ============================================================
//  Audio: physically based water, wind, birds
// ============================================================
// Water is synthesized the way real liquid sounds are produced: every sound is a
// tiny air bubble ringing at its Minnaert frequency (f ≈ 3.26 / radius), decaying
// quickly while its pitch rises (van den Doel, "Physically-based models for liquid
// sounds", 2005). A brook is thousands of such bubbles per second; a drop "plink"
// is one larger bubble with a strong upward chirp.
const WATER_WORKLET = `
class WaterProc extends AudioWorkletProcessor {
  constructor(){
    super();
    this.bub = [];
    this.thumps = [];
    this.duck = 1;        // the stream dips briefly under each glug so it can be heard
    this.flow = 1;
    this.t = Math.random() * 100;
    this.brown = 0; this.lp = 0;
    this.port.onmessage = e => {
      const m = e.data;
      if (m.type === 'flow') this.flow = m.v;
      else if (m.type === 'glug') this.glug(m);
    };
  }
  pan(p){ const a = (Math.max(-1, Math.min(1, p)) * 0.5 + 0.5) * Math.PI / 2; return [Math.cos(a), Math.sin(a)]; }
  add(r, amp, eps, pan, delay = 0, dmul = 1){
    if (this.bub.length > 600) return;
    const f0 = 3.26 / r;
    const d = (0.043 * f0 + 0.0014 * Math.pow(f0, 1.5)) * dmul;
    const [gl, gr] = this.pan(pan);
    this.bub.push({ ph: 0, f0, sig: eps * d, dec: Math.exp(-d / sampleRate), env: amp, t: -delay, gl, gr });
  }
  // A tap = a "glug": big bubbles break free one after another. Each is a low, round
  // ring (Minnaert ~200–400 Hz) with a rising pitch; the first is lowest ("glu-"),
  // the next smaller and shorter ("-ug"). A soft low thump marks the surface opening.
  // m.freqs: the pitch of each beat (bubble radius = 3.26 / f). Loudness is evened out
  // across the range so high notes are not drowned by low ones; the chirp is kept small
  // so each beat still lands on its note.
  // steady sine at an exact pitch: the resonance of the water cavity (like a suikinkutsu)
  ring(f, amp, decayPerSec, pan, delay){
    const [gl, gr] = this.pan(pan);
    this.bub.push({ ph: 0, f0: f, sig: 0, dec: Math.exp(-decayPerSec / sampleRate), env: amp, t: -delay, gl, gr });
  }
  glug(m){
    this.duck = 0.4;
    let t = 0;
    m.freqs.forEach((f, k) => {
      const r = 3.26 / (f * 0.945);   // start ~1 semitone low: the rising chirp is heard ~1 higher
      const amp = 0.15 * Math.pow(r / 0.011, 0.1) * m.gain * (k ? 0.45 : 1) * (0.9 + Math.random() * 0.2);
      this.add(r, amp, 0.09 + Math.random() * 0.04, m.pan + (Math.random() - 0.5) * 0.1, t, 0.6);
      if (k === 0) {                  // the note keeps sounding briefly after the bubble, so its pitch is clear
        this.ring(f, amp * 0.75, 4.5, m.pan, t + 0.004);
        this.ring(f * 2, amp * 0.12, 9, m.pan, t + 0.004);
      }
      this.thumps.push({ env: amp * 0.18, dec: Math.exp(-70 / sampleRate), lp: 0, t: -t, pan: this.pan(m.pan) });
      t += 0.08 + Math.random() * 0.04;
    });
    for (let i = 0; i < m.fizz; i++)      // a few small bubbles trailing behind
      this.add(this.randR(0.0008, 0.004, 1.8), 0.007 * m.gain * Math.random(), 0.2,
               m.pan + (Math.random() - 0.5) * 0.4, 0.02 + Math.random() * (t + 0.1));
  }
  randR(rmin, rmax, beta){           // power-law bubble size distribution
    const a = Math.pow(rmin, 1 - beta), b = Math.pow(rmax, 1 - beta);
    return Math.pow(a + Math.random() * (b - a), 1 / (1 - beta));
  }
  process(_, outputs){
    const out = outputs[0], L = out[0], R = out[1] || out[0];
    const n = L.length, dt = 1 / sampleRate, blk = n * dt;
    this.t += blk;
    const t = this.t, flow = this.flow;
    // the stream surges and calms irregularly
    const surge = 0.55 + 0.25 * Math.sin(t * 0.31 + 2.0 * Math.sin(t * 0.07)) + 0.2 * Math.sin(t * 1.7 + Math.sin(t * 0.5) * 2.0);
    this.duck += (1 - this.duck) * Math.min(1, blk / 0.35);
    const duck = this.duck;
    const rate = 900 * flow * surge;
    let k = rate * blk; k = Math.floor(k) + (Math.random() < k % 1 ? 1 : 0);
    for (let i = 0; i < k; i++) {
      const r = this.randR(0.00035, 0.0065, 2.4);
      this.add(r, 0.012 * duck * Math.pow(r / 0.001, 1.1) * (0.4 + Math.random()), 0.05 + Math.random() * 0.2,
               Math.random() * 1.6 - 0.8, Math.random() * blk);
    }
    // gurgles: clusters of similar bubbles released together
    if (Math.random() < 3.5 * blk * flow * surge) {
      const rc = this.randR(0.0012, 0.006, 1.4), m = 3 + Math.floor(Math.random() * 9), p = Math.random() * 1.4 - 0.7;
      for (let i = 0; i < m; i++)
        this.add(rc * (0.8 + Math.random() * 0.4), 0.02 * duck * Math.pow(rc / 0.001, 0.9) * (0.5 + Math.random()),
                 0.1 + Math.random() * 0.3, p + (Math.random() - 0.5) * 0.2, i * 0.009 + Math.random() * 0.012);
    }
    for (let i = 0; i < n; i++) {   // soft low bed of rushing water under the bubbles
      this.brown = (this.brown + 0.02 * (Math.random() * 2 - 1)) / 1.02;
      this.lp += 0.08 * (this.brown - this.lp);
      const v = this.lp * 0.9 * flow * duck * (0.6 + 0.4 * surge);
      L[i] = v; if (R !== L) R[i] = v;
    }
    const TAU = 2 * Math.PI;
    for (let j = this.bub.length - 1; j >= 0; j--) {
      const b = this.bub[j];
      for (let i = 0; i < n; i++) {
        if (b.t < 0) { b.t += dt; continue; }
        b.ph += TAU * b.f0 * (1 + b.sig * b.t) * dt;
        const v = b.env * Math.sin(b.ph);
        b.env *= b.dec; b.t += dt;
        L[i] += v * b.gl; if (R !== L) R[i] += v * b.gr;
      }
      if (b.env < 1e-5) this.bub.splice(j, 1);
    }
    for (let j = this.thumps.length - 1; j >= 0; j--) {
      const c = this.thumps[j];
      for (let i = 0; i < n; i++) {
        if (c.t < 0) { c.t += dt; continue; }
        c.lp += 0.06 * ((Math.random() * 2 - 1) - c.lp);   // muffled low noise
        const v = c.lp * c.env; c.env *= c.dec;
        L[i] += v * c.pan[0]; if (R !== L) R[i] += v * c.pan[1];
      }
      if (c.env < 1e-5) this.thumps.splice(j, 1);
    }
    return true;
  }
}
registerProcessor('water', WaterProc);
`;

let actx = null, master, conv, waterNode = null, muted = false;
let windLevel = 0;      // 0..1, also stirs the water surface

async function initAudio(){
  actx = new (window.AudioContext || window.webkitAudioContext)();
  master = actx.createGain(); master.gain.value = 0;
  master.gain.linearRampToValueAtTime(0.9, actx.currentTime + 3);
  const comp = actx.createDynamicsCompressor();
  comp.threshold.value = -6; comp.ratio.value = 2;
  comp.attack.value = 0.003; comp.release.value = 0.1;   // recover fast so a note's tail is not pumped down
  master.connect(comp).connect(actx.destination);

  // open-air reverb (generated impulse response)
  conv = actx.createConvolver();
  const len = actx.sampleRate * 3, ir = actx.createBuffer(2, len, actx.sampleRate);
  for (let c = 0; c < 2; c++) {
    const d = ir.getChannelData(c);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 4) * (i < 400 ? i / 400 : 1);
  }
  conv.buffer = ir;
  const wet = actx.createGain(); wet.gain.value = 0.5;
  conv.connect(wet).connect(master);

  // --- water ---
  try {
    if (actx.audioWorklet) {
      const url = URL.createObjectURL(new Blob([WATER_WORKLET], { type: 'application/javascript' }));
      await actx.audioWorklet.addModule(url);
      waterNode = new AudioWorkletNode(actx, 'water', { outputChannelCount: [2] });
    } else waterNode = waterFallback();   // no worklets outside localhost/https (e.g. opened as a file)
    const tone = actx.createBiquadFilter(); tone.type = 'lowpass'; tone.frequency.value = 9000;
    const wg = actx.createGain(); wg.gain.value = 0.9;
    const ws = actx.createGain(); ws.gain.value = 0.18;
    waterNode.connect(tone).connect(wg).connect(master);
    tone.connect(ws).connect(conv);
  } catch (err) {
    console.error('water worklet failed', err);
  }

  initWind();
  initBirds();
}

// Runs the same processor on the main thread through a ScriptProcessorNode.
function waterFallback(){
  let Proc;
  new Function('sampleRate', 'AudioWorkletProcessor', 'registerProcessor', WATER_WORKLET)(
    actx.sampleRate, class { constructor(){ this.port = {}; } }, (_, c) => Proc = c);
  const proc = new Proc();
  const node = actx.createScriptProcessor(1024, 0, 2);
  const L = new Float32Array(128), R = new Float32Array(128);
  node.onaudioprocess = e => {
    const oL = e.outputBuffer.getChannelData(0), oR = e.outputBuffer.getChannelData(1);
    for (let o = 0; o < oL.length; o += 128) {
      proc.process([], [[L, R]]);
      oL.set(L, o); oR.set(R, o);
    }
  };
  node.port = { postMessage: data => proc.port.onmessage({ data }) };
  return node;
}

// Tap → a "glug" tuned to D minor. The ten fingers are ten keys, left pinky to right pinky:
// D4 E F G A | B♭ C D5 E F5. The first beat sounds the finger's note and the softer second
// beat the same note an octave up, so every tap reads as one clear pitch; a deep stroke
// doubles the first beat.
const NOTE_NAMES = ['D', 'E', 'F', 'G', 'A', 'B♭', 'C', 'D', 'E', 'F'];
const D_MINOR = [0, 2, 3, 5, 7, 8, 10];
const scaleFreq = i => 293.66 * Math.pow(2, (D_MINOR[i % 7] + 12 * Math.floor(i / 7)) / 12);
function dropSound(key, x, speed, amp, vol = 1){
  if (!waterNode || muted) return;
  const f = scaleFreq(key);
  const freqs = amp > 0.55 ? [f, f, f * 2] : [f, f * 2];
  waterNode.port.postMessage({
    type: 'glug',
    freqs,
    gain: (2.2 + speed * 1.8 + amp * 0.5) * vol,
    fizz: Math.floor(3 + speed * 8),
    pan: (x - 0.5) * 1.4,
  });
}

// --- wind: comes and goes in gusts; rustling leaves ride on top ---
let windNodes = null, windTarget = 0, nextWindChange = 0, windPhase = Math.random() * 100;
function noiseBuffer(sec){
  const b = actx.createBuffer(1, actx.sampleRate * sec, actx.sampleRate), d = b.getChannelData(0);
  let b0 = 0, b1 = 0, b2 = 0;
  for (let i = 0; i < d.length; i++) {         // pink noise
    const w = Math.random() * 2 - 1;
    b0 = 0.99765 * b0 + w * 0.0990460; b1 = 0.96300 * b1 + w * 0.2965164; b2 = 0.57000 * b2 + w * 1.0526913;
    d[i] = (b0 + b1 + b2 + w * 0.1848) * 0.2;
  }
  return b;
}
function loopNoise(buf){
  const s = actx.createBufferSource(); s.buffer = buf; s.loop = true;
  s.start(0, Math.random() * buf.duration); return s;
}
function initWind(){
  const buf = noiseBuffer(6);
  const body = actx.createBiquadFilter(); body.type = 'bandpass'; body.frequency.value = 400; body.Q.value = 0.8;
  const howl = actx.createBiquadFilter(); howl.type = 'bandpass'; howl.frequency.value = 650; howl.Q.value = 9;
  const howlG = actx.createGain(); howlG.gain.value = 0.35;
  const gain = actx.createGain(); gain.gain.value = 0;
  const pan = actx.createStereoPanner();
  loopNoise(buf).connect(body).connect(gain);
  loopNoise(buf).connect(howl).connect(howlG).connect(gain);
  gain.connect(pan).connect(master);

  const leafHP = actx.createBiquadFilter(); leafHP.type = 'highpass'; leafHP.frequency.value = 2800;
  const leafPk = actx.createBiquadFilter(); leafPk.type = 'peaking'; leafPk.frequency.value = 6000; leafPk.gain.value = 5;
  const leaf = actx.createGain(); leaf.gain.value = 0;
  const leafPan = actx.createStereoPanner(); leafPan.pan.value = 0.4;
  loopNoise(buf).connect(leafHP).connect(leafPk).connect(leaf).connect(leafPan).connect(master);
  const leafWet = actx.createGain(); leafWet.gain.value = 0.3; leafPan.connect(leafWet).connect(conv);

  windNodes = { body, howl, gain, pan, leaf, leafPan };
  nextWindChange = performance.now() + 6000 + Math.random() * 8000;
  setInterval(updateWindAudio, 90);
}

// Called every frame from the main loop (drives the visuals too).
function stepWind(now, dt){
  if (!windNodes) return;
  if (now > nextWindChange) {
    if (windTarget > 0 || Math.random() < 0.35) { windTarget = 0; nextWindChange = now + 12000 + Math.random() * 25000; }   // calm spell
    else { windTarget = 0.35 + Math.random() * 0.65; nextWindChange = now + 3500 + Math.random() * 7000; }                 // gust
  }
  const tau = windTarget > windLevel ? 2.2 : 3.5;
  windLevel += (windTarget - windLevel) * Math.min(1, dt / tau);
  windPhase += dt;
}
function updateWindAudio(){
  if (!windNodes) return;
  if (waterNode) waterNode.port.postMessage({ type: 'flow', v: 1 + 0.35 * windLevel });
  const t = actx.currentTime, p = windPhase;
  const flutter = 0.75 + 0.15 * Math.sin(p * 1.3) + 0.1 * Math.sin(p * 3.7 + Math.sin(p) * 2);
  const g = windLevel * flutter;
  windNodes.gain.gain.setTargetAtTime(g * 0.55, t, 0.12);
  windNodes.body.frequency.setTargetAtTime(220 + g * 650, t, 0.2);
  windNodes.howl.frequency.setTargetAtTime(420 + g * 520 + Math.sin(p * 0.9) * 60, t, 0.25);
  windNodes.pan.pan.setTargetAtTime(Math.sin(p * 0.21) * 0.5, t, 0.5);
  // leaves rustle in irregular bursts once the wind picks up
  const rustle = Math.max(0, g - 0.2) * (0.35 + Math.random() * 0.9);
  windNodes.leaf.gain.setTargetAtTime(rustle * 0.22, t, 0.04);
  windNodes.leafPan.pan.setTargetAtTime(Math.sin(p * 0.37 + 1) * 0.7, t, 0.3);
}

// --- birds: a few individuals nearby, each with its own song; they sing in spells ---
let birdBus, birds = [], birdsActive = true, birdSpellEnd = 0;
let sineWave = null;
const sinePlus = () => sineWave || (sineWave = actx.createPeriodicWave(new Float32Array([0, 0, 0, 0]), new Float32Array([0, 1, 0.06, 0.02])));

// One sung note: frequency follows the points [[time, Hz], ...]
function note(dest, t, pts, vol, vib = 0, vibRate = 0){
  const o = actx.createOscillator();
  o.setPeriodicWave(sinePlus());
  o.frequency.setValueAtTime(pts[0][1], t);
  for (let i = 1; i < pts.length; i++) o.frequency.exponentialRampToValueAtTime(pts[i][1], t + pts[i][0]);
  const dur = pts[pts.length - 1][0];
  const g = actx.createGain();
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(vol, t + Math.min(0.015, dur * 0.2));
  g.gain.linearRampToValueAtTime(vol * 0.75, t + dur * 0.75);
  g.gain.linearRampToValueAtTime(0, t + dur);
  if (vib) {
    const l = actx.createOscillator(), lg = actx.createGain();
    l.frequency.value = vibRate; lg.gain.value = pts[0][1] * vib;
    l.connect(lg).connect(o.frequency); l.start(t); l.stop(t + dur + 0.05);
  }
  o.connect(g).connect(dest);
  o.start(t); o.stop(t + dur + 0.05);
}
const J = (v, j = 0.06) => v * (1 + (Math.random() * 2 - 1) * j);

const SPECIES = {
  // quick descending twitter (white-eye / sparrow-like)
  twitter(b, t){
    const n = 5 + Math.floor(Math.random() * 7);
    for (let i = 0; i < n; i++) {
      const f = J(b.f, 0.05), s = t + i * J(0.065, 0.15);
      note(b.out, s, [[0, f], [0.032, f * 0.68]], b.vol * J(0.8, 0.2));
    }
    return n * 0.065;
  },
  // fluting phrase of glides (thrush-like); keeps its own motif, slightly varied
  whistle(b, t){
    let s = t;
    for (const m of b.motif) {
      const d = J(m.d, 0.1);
      note(b.out, s, m.f.map((f, i) => [i * d / (m.f.length - 1 || 1), J(f, 0.03)]), b.vol * m.v, 0.012, 22);
      s += d + J(0.05, 0.4);
    }
    return s - t;
  },
  // fast trill on one pitch
  trill(b, t){
    const dur = J(0.9, 0.3), rate = J(26, 0.15), f = J(b.f, 0.04);
    const n = Math.floor(dur * rate);
    for (let i = 0; i < n; i++) note(b.out, t + i / rate, [[0, f * 1.04], [0.6 / rate, f * (1 - 0.1 * i / n)]], b.vol * (0.6 + 0.4 * Math.sin(Math.PI * i / n)));
    return dur;
  },
  // two-note call "tee-tew", repeated
  call(b, t){
    const reps = 2 + Math.floor(Math.random() * 3);
    for (let i = 0; i < reps; i++) {
      const s = t + i * J(0.55, 0.1);
      note(b.out, s, [[0, b.f], [0.11, b.f * 1.18]], b.vol);
      note(b.out, s + 0.17, [[0, b.f * 1.12], [0.06, b.f * 1.15], [0.2, b.f * 0.74]], b.vol * 0.9);
    }
    return reps * 0.55;
  },
};

function initBirds(){
  birdBus = actx.createGain(); birdBus.gain.value = 1;
  const air = actx.createBiquadFilter(); air.type = 'lowpass'; air.frequency.value = 8500;
  const send = actx.createGain(); send.gain.value = 0.55;
  birdBus.connect(air).connect(master);
  air.connect(send).connect(conv);

  const make = (species, f, extra = {}) => {
    const pan = actx.createStereoPanner(); pan.pan.value = Math.random() * 1.6 - 0.8;
    const dist = actx.createBiquadFilter(); dist.type = 'lowpass';
    const far = Math.random();
    dist.frequency.value = 12000 - far * 6000;           // distant birds sound duller
    dist.connect(pan).connect(birdBus);
    birds.push({ species, f, out: dist, vol: 0.05 * (1 - far * 0.6), ...extra });
  };
  make('twitter', J(5600, 0.08));
  make('twitter', J(4800, 0.08));
  make('whistle', 0, { motif: [
    { d: 0.18, f: [2100, 2700], v: 1 }, { d: 0.12, f: [2900, 2500], v: 0.8 }, { d: 0.26, f: [2400, 3300, 2600], v: 0.9 },
  ] });
  make('whistle', 0, { motif: [
    { d: 0.3, f: [3200, 3200], v: 0.9 }, { d: 0.22, f: [2600, 2000], v: 1 }, { d: 0.1, f: [3600, 3900], v: 0.6 }, { d: 0.1, f: [3600, 3900], v: 0.6 },
  ] });
  make('trill', J(4200, 0.1));
  make('call', J(2900, 0.08));

  birdSpellEnd = performance.now() + 20000 + Math.random() * 30000;
  const loop = () => {
    const now = performance.now();
    if (now > birdSpellEnd) {               // alternate busy spells and quiet spells
      birdsActive = !birdsActive;
      birdSpellEnd = now + (birdsActive ? 25000 + Math.random() * 40000 : 10000 + Math.random() * 25000);
    }
    let wait = 1500 + Math.random() * 4500;
    if (birdsActive && !muted) {
      const b = birds[Math.floor(Math.random() * birds.length)];
      const len = SPECIES[b.species](b, actx.currentTime + 0.05);
      // birds often repeat themselves, or another one answers
      if (Math.random() < 0.45) setTimeout(() => SPECIES[b.species](b, actx.currentTime + 0.05), (len + J(1.2, 0.4)) * 1000);
      else if (Math.random() < 0.3) {
        const o = birds[Math.floor(Math.random() * birds.length)];
        setTimeout(() => SPECIES[o.species](o, actx.currentTime + 0.05), (len + J(0.6, 0.5)) * 1000);
      }
      wait += len * 1000;
    } else wait = 2000;
    setTimeout(loop, wait);
  };
  setTimeout(loop, 3000 + Math.random() * 4000);
}

// ============================================================
//  Ripples from gestures
// ============================================================
let tempo = 0;          // recent playing intensity → water "liveliness" (sim speed)
let lastHandSeen = -1e9;

// key: which of the ten notes to sound (defaults to the horizontal position)
function ripple(x, y, speed, amp, sound = true, key = Math.min(9, Math.floor(x * 10))){
  // amplitude → ripple size, speed → sharpness & strength
  const r = (0.006 + amp * 0.032) * (1 - 0.3 * speed);
  const s = -(0.35 + speed * 1.4 + amp * 0.6);
  addDrop(x, y, r, s);
  if (speed + amp > 0.7) addDrop(x, y, r * 0.45, -s * 0.35, 130 + amp * 80); // rebound column
  tempo = Math.min(1, tempo + 0.15 + speed * 0.25);
  if (sound) {
    dropSound(key, x, speed, amp);
    glows.push({ x, y, t: performance.now(), s: 0.4 + amp, note: NOTE_NAMES[key] });
  }
}

// Mouse / touch
let pointerDown = false, lastP = null;
canvas.addEventListener('pointerdown', e => {
  pointerDown = true;
  const x = e.clientX / innerWidth, y = e.clientY / innerHeight;
  ripple(x, y, 0.5 + Math.random() * 0.3, 0.3 + Math.random() * 0.3);
  lastP = { x, y };
});
addEventListener('pointerup', () => { pointerDown = false; lastP = null; });
canvas.addEventListener('pointermove', e => {
  if (!pointerDown) return;
  const x = e.clientX / innerWidth, y = e.clientY / innerHeight;
  if (lastP && Math.hypot((x - lastP.x) * aspect, y - lastP.y) > 0.012) {
    addDrop(x, y, 0.01, -0.12);
    lastP = { x, y };
  }
});

// ============================================================
//  Hand tracking (MediaPipe Hand Landmarker)
// ============================================================
const video = document.getElementById('video');
const camCanvas = document.getElementById('cam');
const cam = camCanvas.getContext('2d');
let landmarker = null, lastVideoTime = -1, showCam = true;
const TIPS = [4, 8, 12, 16, 20], BASES = [2, 5, 9, 13, 17];
const fingers = new Map();
let tipsForOverlay = [];
const glows = [];       // short flashes (and note names) where a tap landed

async function initHands(){
  setStatus('Opening camera…');
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480, facingMode: 'user' }, audio: false });
    video.srcObject = stream;
    await video.play();
  } catch (err) {
    setStatus('Camera unavailable — click the water with your mouse instead');
    return;
  }
  setStatus('Loading hand-tracking model…');
  try {
    const V = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';
    const { FilesetResolver, HandLandmarker } = await import(V + '/vision_bundle.mjs');
    const fileset = await FilesetResolver.forVisionTasks(V + '/wasm');
    landmarker = await HandLandmarker.createFromOptions(fileset, {
      baseOptions: {
        modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task',
        delegate: 'GPU',
      },
      runningMode: 'VIDEO',
      numHands: 2,
      minHandDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5,
    });
    camCanvas.width = 320; camCanvas.height = 240;
    camCanvas.style.display = showCam ? 'block' : 'none';
    setStatus('Hand tracking ready · hold your hands in front of the camera');
  } catch (err) {
    console.error(err);
    setStatus('Hand model failed to load — click the water with your mouse instead');
  }
}

function detectHands(now){
  if (!landmarker || video.readyState < 2 || video.currentTime === lastVideoTime) return;
  lastVideoTime = video.currentTime;
  const res = landmarker.detectForVideo(video, now);
  tipsForOverlay = [];
  const hands = res.landmarks || [];
  if (hands.length) lastHandSeen = now;

  // Which of the player's hands is which: with two hands, the one further left on the
  // (mirrored) screen is the left hand. With one hand, use MediaPipe's label, which is
  // swapped because it assumes a mirrored selfie image and the camera frames are not.
  const sides = hands.map((lm, hi) => res.handedness?.[hi]?.[0]?.categoryName === 'Left' ? 'R' : 'L');
  if (hands.length === 2) {
    const leftFirst = (1 - hands[0][0].x) < (1 - hands[1][0].x);
    sides[0] = leftFirst ? 'L' : 'R'; sides[1] = leftFirst ? 'R' : 'L';
  }

  hands.forEach((lm, hi) => {
    const label = sides[hi];
    const scale = Math.hypot(lm[0].x - lm[9].x, lm[0].y - lm[9].y) || 0.1;
    TIPS.forEach((ti, fi) => {
      const tip = lm[ti], base = lm[BASES[fi]];
      const x = 1 - tip.x, y = tip.y;               // mirror, like looking into water
      tipsForOverlay.push({ x, y });
      // fingertip height relative to its knuckle, in hand-size units:
      // pressing a "key" moves the tip down relative to the knuckle
      const rel = (tip.y - base.y) / scale;
      const key = label + fi;
      let st = fingers.get(key);
      if (!st || now - st.t > 300) {
        st = { rel, v: 0, t: now, down: false, start: 0, peak: 0, t0: 0, cool: 0, x, y };
        fingers.set(key, st);
        return;
      }
      const dt = Math.max(0.001, (now - st.t) / 1000);
      const relS = st.rel + (rel - st.rel) * 0.75;
      const v = (relS - st.rel) / dt;
      st.v = st.v * 0.35 + v * 0.65;

      // gliding fingers leave a faint wake
      const move = Math.hypot((x - st.x) * aspect, y - st.y) / dt;
      if (move > 0.6 && fi === 1) addDrop(x, y, 0.008, -Math.min(0.25, move * 0.05));

      if (!st.down) {
        if (st.v > 1.1 && now > st.cool) { st.down = true; st.start = st.rel; st.peak = st.v; st.t0 = now; }
      } else {
        st.peak = Math.max(st.peak, st.v);
        const disp = relS - st.start;
        if (st.v < 0.3 || now - st.t0 > 450) {
          st.down = false;
          if (disp > 0.06 && now > (handLock[label] || 0)) {
            const speed = Math.min(1, Math.max(0, (st.peak - 1.1) / 7));
            const amp = Math.min(1, Math.max(0, (disp - 0.06) / 0.55));
            // left hand: pinky→thumb = keys 0..4; right hand: thumb→pinky = keys 5..9
            const c = { x, y, speed, amp, key: label === 'L' ? 4 - fi : 5 + fi, score: st.peak * disp };
            const p = pendingTap[label];
            if (!p) pendingTap[label] = { best: c, at: now + 70 };
            else if (c.score > p.best.score) p.best = c;
            st.cool = now + 90;
          }
        }
      }
      st.rel = relS; st.t = now; st.x = x; st.y = y;
    });
  });

  if (showCam) drawCam(hands);
}

// Tapping one finger drags its neighbours along a little. Strokes from the same hand that
// end within 70 ms are treated as one tap, and only the strongest finger sounds.
const pendingTap = {}, handLock = {};
function resolveTaps(now){
  for (const side in pendingTap) {
    const p = pendingTap[side];
    if (now < p.at) continue;
    const c = p.best;
    ripple(c.x, c.y, c.speed, c.amp, true, c.key);
    handLock[side] = now + 60;
    delete pendingTap[side];
  }
}

const BONES = [[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],
               [9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];
function drawCam(hands){
  const w = camCanvas.width, h = camCanvas.height;
  cam.save();
  cam.translate(w, 0); cam.scale(-1, 1);
  cam.drawImage(video, 0, 0, w, h);
  cam.restore();
  cam.strokeStyle = 'rgba(200,255,150,.8)'; cam.lineWidth = 1.5;
  cam.fillStyle = '#fff';
  hands.forEach(lm => {
    cam.beginPath();
    BONES.forEach(([a, b]) => { cam.moveTo((1 - lm[a].x) * w, lm[a].y * h); cam.lineTo((1 - lm[b].x) * w, lm[b].y * h); });
    cam.stroke();
    TIPS.forEach(i => { cam.beginPath(); cam.arc((1 - lm[i].x) * w, lm[i].y * h, 3, 0, 7); cam.fill(); });
  });
}

function drawOverlay(now){
  fx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);
  const W = fxCanvas.width, H = fxCanvas.height;
  for (const p of tipsForOverlay) {
    const g = fx.createRadialGradient(p.x * W, p.y * H, 0, p.x * W, p.y * H, 14);
    g.addColorStop(0, 'rgba(255,255,240,.35)'); g.addColorStop(1, 'rgba(255,255,240,0)');
    fx.fillStyle = g; fx.beginPath(); fx.arc(p.x * W, p.y * H, 14, 0, 7); fx.fill();
  }
  for (let i = glows.length - 1; i >= 0; i--) {
    const gl_ = glows[i], k = (now - gl_.t) / 500;
    if (k > 1) { glows.splice(i, 1); continue; }
    const r = 10 + k * 40 * gl_.s;
    const g = fx.createRadialGradient(gl_.x * W, gl_.y * H, 0, gl_.x * W, gl_.y * H, r);
    g.addColorStop(0, `rgba(255,255,230,${0.35 * (1 - k)})`); g.addColorStop(1, 'rgba(255,255,230,0)');
    fx.fillStyle = g; fx.beginPath(); fx.arc(gl_.x * W, gl_.y * H, r, 0, 7); fx.fill();
    if (gl_.note) {
      fx.font = '300 18px -apple-system, sans-serif';
      fx.textAlign = 'center';
      fx.fillStyle = `rgba(255,255,240,${0.85 * (1 - k)})`;
      fx.fillText(gl_.note, gl_.x * W, gl_.y * H - 22 - k * 18);
    }
  }
}

// ============================================================
//  Main loop
// ============================================================
const t0 = performance.now();
let last = t0, acc = 0, waterTime = 0, nextDrip = t0 + 4000;
const dropBuf = new Float32Array(64);

function frame(now){
  const dt = Math.min(0.05, (now - last) / 1000); last = now;

  detectHands(now);
  resolveTaps(now);
  stepWind(now, dt);
  waterTime += dt * (1 + 1.3 * windLevel);

  // occasional drip from the leaves when nobody is playing
  if (now > nextDrip) {
    if (now - lastHandSeen > 4000 && !pointerDown) {
      const x = 0.2 + Math.random() * 0.6, y = 0.15 + Math.random() * 0.6;
      ripple(x, y, 0.3, 0.15, false);
      dropSound(Math.floor(Math.random() * 10), x, 0.2, 0.1, 0.5);
    }
    nextDrip = now + 6000 + Math.random() * 9000;
  }

  // apply due drops in one pass
  let count = 0;
  for (let i = drops.length - 1; i >= 0 && count < 16; i--) {
    const d = drops[i];
    if (d.at > now) continue;
    dropBuf.set([d.x, 1 - d.y, d.r, d.s], count * 4);
    count++; drops.splice(i, 1);
  }
  if (count) simPass(dropProg, () => {
    gl.uniform4fv(dropProg.u('uDrops'), dropBuf);
    gl.uniform1i(dropProg.u('uCount'), count);
    gl.uniform1f(dropProg.u('uAspect'), aspect);
  });

  // faster playing → livelier water (ripples travel faster)
  tempo *= Math.exp(-dt / 2.0);
  const rate = 110 + 120 * tempo;
  acc += dt * rate;
  let steps = 0;
  while (acc >= 1 && steps < 6) {
    simPass(updateProg, () => gl.uniform1f(updateProg.u('uDamp'), 0.993));
    acc -= 1; steps++;
  }
  if (acc > 1) acc = 0;
  simPass(gradProg);

  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, canvas.width, canvas.height);
  gl.useProgram(renderProg);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, simA.t);
  gl.uniform1i(renderProg.u('uTex'), 0);
  gl.uniform1f(renderProg.u('uTime'), waterTime);
  gl.uniform1f(renderProg.u('uAspect'), aspect);
  gl.uniform1f(renderProg.u('uSimScale'), 9.0);
  gl.uniform1f(renderProg.u('uAmb'), 0.2 + 0.14 * windLevel);   // wind roughens the surface
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

  drawOverlay(now);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ============================================================
//  Start / keys
// ============================================================
const startEl = document.getElementById('start');
startEl.addEventListener('click', () => {
  startEl.style.opacity = 0;
  setTimeout(() => startEl.remove(), 1300);
  initAudio();
  initHands();
  setTimeout(() => document.getElementById('hint').style.opacity = 0, 9000);
}, { once: true });

addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  // number keys 1–0 play the ten notes directly (D4 … F5), to hear the scale without the camera
  if (/^[0-9]$/.test(k) && actx) {
    const key = k === '0' ? 9 : +k - 1;
    ripple((key + 0.5) / 10, 0.5, 0.5, 0.3, true, key);
  }
  if (k === 'c') { showCam = !showCam; camCanvas.style.display = showCam && landmarker ? 'block' : 'none'; }
  if (k === 'm' && actx) { muted = !muted; master.gain.setTargetAtTime(muted ? 0 : 0.9, actx.currentTime, 0.1); }
  if (k === 'f') document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
});
</script>
